name = "pmw-paddle-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "pmw-visuals-b14e8"
PADDLE_ENV = "production"

# Isolated Worker for no-charge Paddle sandbox testing. It must be configured
