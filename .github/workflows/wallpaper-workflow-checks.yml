name: Wallpaper workflow checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Models and image bridge
        run: |
          node --test --test-isolation=none scripts/test-creative-model.mjs scripts/test-wallpaper-model.mjs
          node --test backend/wallpaper-image-worker/src/index.test.mjs
      - name: Content and navigation
        run: |
          node scripts/verify-editorial.mjs
          node scripts/verify-navigation.mjs
          node scripts/verify-appearance.mjs
      - name: Verify reproducible workflow generation
        run: |
          node scripts/build-wallpaper-workflow.mjs
          git diff --exit-code
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pmw-qa" playwright@1.56.1 pngjs@7.0.0
          node "$RUNNER_TEMP/pmw-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser behavior and exported pixels
        env:
          PMW_INLINE_PREVIEW: '1'
          PMW_PREVIEW_URL: https://pmw.test
        run: |
          export PMW_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pmw-qa/node_modules/playwright"
          export PMW_PNG_MODULE="$RUNNER_TEMP/pmw-qa/node_modules/pngjs"
          node scripts/verify-wallpaper-workflow.cjs
          node scripts/verify-creative-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-workflow-qa
          path: |
            work/wallpaper-qa/
            work/creative-qa/
